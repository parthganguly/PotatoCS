[package]
name = "odysseus-desktop"
version = "0.3.1"
description = "Local AI workspace for small models on limited hardware"
authors = ["Odysseus Desktop Contributors"]
edition = "2021"

[lib]
name = "odysseus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
screenshots = "0.8.10"
